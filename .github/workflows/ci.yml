# 与 .gitlab-ci.yml 保持等价：push/PR 跑 verify，打 tag 先 verify 再构建镜像推 GHCR。
# web/admin 子模块指向 git.hyhy.fun，要求该仓库匿名可读，否则 checkout 失败。
name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-and-database:
    runs-on: ubuntu-latest
    services:
      database:
        image: timescale/timescaledb@sha256:75d58b53f3337a6babd3a1cce5e503f2300bdede62dd7d743651deb1a95b6d76
        env:
          POSTGRES_USER: iolink_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: iolink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iolink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IOLINK_TEST_PG_DSN: postgres://iolink_test:isolated-ci-only@localhost:5432/iolink_test
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make verify

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-docs.txt
      - run: pip install -r scripts/requirements-docs.txt
      - run: python scripts/check_contracts.py

  build-image:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [go-and-database, contracts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        # GHCR 要求镜像名全小写；metadata-action 会把 github.repository 转为 ghcr.io/autoconfig/iolink
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

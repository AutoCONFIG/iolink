# 远端 CI 只做编译和打包：push/PR 上跑 go build，打 tag 直接构建镜像推 GHCR。
# 测试在本地开发阶段执行（make verify / make integration，见 Makefile）。
name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npm ci --prefix web-mini
      - run: npm run build --prefix web-mini
      - run: make verify
      - run: python -m pip install -r scripts/requirements-docs.txt
      - run: python scripts/check_contracts.py
      - run: npm run typecheck --prefix web
      - run: npm test --prefix web-mini
      - run: npm run typecheck --prefix web-mini

  build-image:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        # GHCR 要求镜像名全小写；metadata-action 会把 github.repository 转为 ghcr.io/autoconfig/iolink
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb@sha256:75d58b53f3337a6babd3a1cce5e503f2300bdede62dd7d743651deb1a95b6d76
        env:
          POSTGRES_USER: iolink
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: iolink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iolink -d iolink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: IOLINK_TEST_PG_DSN=postgres://iolink:isolated-ci-only@127.0.0.1:5432/iolink?sslmode=disable make integration
      - run: IOLINK_TEST_PG_DSN=postgres://iolink:isolated-ci-only@127.0.0.1:5432/iolink?sslmode=disable go test -race -shuffle=on ./internal/migrate ./internal/core ./internal/notifications ./internal/persistence ./internal/wechat -count=1

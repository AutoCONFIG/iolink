services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: iolink
      POSTGRES_PASSWORD: iolink
      POSTGRES_DB: iolink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../docs/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iolink"]
      interval: 5s
      retries: 10

volumes:
  pgdata:

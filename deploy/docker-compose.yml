services:
  db:
    image: timescale/timescaledb@sha256:75d58b53f3337a6babd3a1cce5e503f2300bdede62dd7d743651deb1a95b6d76
    environment:
      POSTGRES_USER: iolink
      POSTGRES_PASSWORD: iolink
      POSTGRES_DB: iolink
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iolink"]
      interval: 5s
      retries: 10

volumes:
  pgdata:

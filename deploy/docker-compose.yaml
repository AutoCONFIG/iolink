services:
  db:
    image: timescale/timescaledb:latest-pg16
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_USER: iolink
      POSTGRES_PASSWORD: ${IOLINK_PG_PASSWORD:?set IOLINK_PG_PASSWORD in .env}
      POSTGRES_DB: iolink
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iolink -d iolink"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  iolinkd:
    image: ${IOLINKD_IMAGE:-ghcr.io/autoconfig/iolink:latest}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 15s
    volumes:
      - ./logs:/var/log/iolink
      - ./secrets:/run/iolink/secrets:ro
    depends_on:
      db: {condition: service_healthy}
    ports:
      - "${IOLINK_HTTP_BIND:-127.0.0.1}:${IOLINK_HTTP_PORT:-8080}:8080"
      - "${IOLINK_MQTT_BIND:-127.0.0.1}:${IOLINK_MQTT_PORT:-1883}:1883"
    environment:
      IOLINK_HTTP_ADDR: :8080
      IOLINK_MQTT_ADDR: :1883
      IOLINK_PG_DSN: postgres://iolink:${IOLINK_PG_PASSWORD}@db:5432/iolink?sslmode=disable
      IOLINK_SECRET_KEY: ${IOLINK_SECRET_KEY:?set IOLINK_SECRET_KEY in .env}
      IOLINK_LICENSE_PUBLIC_KEY_FILE: ${IOLINK_LICENSE_PUBLIC_KEY_FILE:-}
      IOLINK_LICENSE_KEY_ID: ${IOLINK_LICENSE_KEY_ID:-}
      IOLINK_REPORT_INTERVAL: ${IOLINK_REPORT_INTERVAL:-60}
      IOLINK_OFFLINE_GRACE: ${IOLINK_OFFLINE_GRACE:-3}
      IOLINK_OPENAPI_RATE_PER_MINUTE: ${IOLINK_OPENAPI_RATE_PER_MINUTE:-60}
      IOLINK_OPENAPI_BURST: ${IOLINK_OPENAPI_BURST:-10}
      IOLINK_WX_APPID: ${IOLINK_WX_APPID:-}
      IOLINK_WX_SECRET: ${IOLINK_WX_SECRET:-}
      IOLINK_WX_TEMPLATE_ID: ${IOLINK_WX_TEMPLATE_ID:-}
      GIN_MODE: release
      IOLINK_LOG_DIR: /var/log/iolink
      IOLINK_LOG_LEVEL: ${IOLINK_LOG_LEVEL:-info}
      IOLINK_LOG_MAX_MB: ${IOLINK_LOG_MAX_MB:-20}
      IOLINK_LOG_BACKUPS: ${IOLINK_LOG_BACKUPS:-5}
    healthcheck:
      test: ["CMD", "wget", "--spider", "--timeout=2", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  default:
    name: iolink-net

volumes:
  pgdata:

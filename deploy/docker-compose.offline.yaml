services:
  db:
    image: ${IOLINK_DB_IMAGE:?set IOLINK_DB_IMAGE from bundle manifest}
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_USER: iolink
      POSTGRES_PASSWORD: ${IOLINK_PG_PASSWORD:?set IOLINK_PG_PASSWORD}
      POSTGRES_DB: iolink
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iolink -d iolink"]
      interval: 5s
      timeout: 3s
      retries: 10
  iolinkd:
    image: ${IOLINKD_IMAGE:?set IOLINKD_IMAGE from bundle manifest}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    ports:
      - "${IOLINK_HTTP_BIND:-127.0.0.1}:${IOLINK_HTTP_PORT:-8080}:8080"
      - "${IOLINK_MQTT_BIND:-127.0.0.1}:${IOLINK_MQTT_PORT:-1883}:1883"
    environment:
      IOLINK_HTTP_ADDR: :8080
      IOLINK_MQTT_ADDR: :1883
      IOLINK_PG_DSN: postgres://iolink:${IOLINK_PG_PASSWORD}@db:5432/iolink?sslmode=disable
      IOLINK_SECRET_KEY: ${IOLINK_SECRET_KEY:?set IOLINK_SECRET_KEY}
      IOLINK_LICENSE_PUBLIC_KEY_FILE: ${IOLINK_LICENSE_PUBLIC_KEY_FILE:-}
      IOLINK_LICENSE_KEY_ID: ${IOLINK_LICENSE_KEY_ID:-}
      IOLINK_REPORT_INTERVAL: ${IOLINK_REPORT_INTERVAL:-60}
      IOLINK_OFFLINE_GRACE: ${IOLINK_OFFLINE_GRACE:-3}
      IOLINK_LOG_DIR: /var/log/iolink
    volumes:
      - ./logs:/var/log/iolink
      - ../secrets:/run/iolink/secrets:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "--timeout=2", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
volumes:
  pgdata:

networks:
  default:
    name: ${IOLINK_OFFLINE_NETWORK:-iolink-offline}
    internal: true
